appId: studio.optative.affinitygeo
productName: AffinityGeo
directories:
  output: release
  buildResources: build
files:
  - "dist/**"
  - "package.json"
extraResources:
  - from: ../../packages/affinity-scripts/src
    to: affinity-scripts
    filter:
      - "*.js"
  - from: ../../packages/affinity-scripts/loader.js
    to: affinity-scripts/loader.js
npmRebuild: false
win:
  target: nsis
nsis:
  # Assisted installer: asks where to install. Per-user by default (no admin prompt).
  # With oneClick off, the default folder comes from productName: Programs\AffinityGeo.
  # electron-updater runs this same installer with /S (quitAndInstall(true, true)) for updates: silent, then
  # relaunches (checked live on 29 Oct 2026, 0.1.0 to 0.1.1).
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AffinityGeo
  artifactName: "AffinityGeo-Setup-${version}.exe"
publish:
  provider: github
  owner: optative-visuals
  repo: AffinityGeo
  releaseType: draft
